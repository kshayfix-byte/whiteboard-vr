<html>
  <head>
    <title>Whiteboard VR</title>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-41295198-3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'UA-41295198-3');
    </script>
  </head>
  <body>
    <style>
      #vr-toolbar { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; max-width: calc(100% - 24px); font: 14px sans-serif; }
      #vr-toolbar button { padding: 0.5em 0.9em; font: 14px sans-serif; background: white; color: #333; border: 2px solid gray; border-radius: 10px; cursor: pointer; }
      #vr-toolbar button:hover { border-color: orange; color: orange; }
      #vr-toolbar a.toolbar-link { padding: 0.5em 0.9em; font: 14px sans-serif; background: white; color: #333; border: 2px solid gray; border-radius: 10px; text-decoration: none; }
      #vr-toolbar a.toolbar-link:hover { border-color: orange; color: orange; }
      #vr-toolbar button:disabled, #vr-toolbar button:disabled:hover { opacity: 0.45; cursor: not-allowed; border-color: gray; color: #333; }
      #vr-toolbar .label { background: rgba(255,255,255,0.85); border-radius: 10px; padding: 0.3em 0.8em; display: flex; flex-direction: column; }
      #vr-board-name.temporary { font-style: italic; color: #666; }
      #vr-board-state { font-size: 12px; color: gray; }
      #vr-toolbar select { padding: 0.45em 0.6em; font: 14px sans-serif; border: 2px solid gray; border-radius: 10px; background: white; max-width: 220px; }
      #vr-toolbar button.arming, #vr-toolbar button.arming:hover, #vr-toolbar button.erase-board.arming { background: #c0392b; border-color: #c0392b; color: white; }
      #vr-save-status { background: rgba(255,255,255,0.85); border-radius: 10px; padding: 0.3em 0.6em; color: rgb(3, 140, 115); }
      #vr-save-status:empty { display: none; }
      #vr-save-status.error { color: #c0392b; }
      #vr-toolbar button.active { border-color: orange; color: orange; }
      #vr-move-panel { position: fixed; left: 12px; bottom: 12px; z-index: 10; background: rgba(255,255,255,0.92); border-radius: 12px; padding: 10px; font: 14px sans-serif; color: #333; display: grid; grid-template-columns: repeat(3, auto); gap: 6px; align-items: center; justify-items: stretch; max-width: calc(100% - 24px); }
      #vr-move-panel[hidden] { display: none; }
      #vr-move-panel .title { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; }
      #vr-move-state { color: gray; font-size: 12px; }
      #vr-move-panel button { padding: 0.4em 0.7em; font: 14px sans-serif; background: white; color: #333; border: 2px solid gray; border-radius: 10px; cursor: pointer; }
      #vr-move-panel button:hover { border-color: orange; color: orange; }
      #vr-move-panel button:disabled, #vr-move-panel button:disabled:hover { opacity: 0.45; cursor: not-allowed; border-color: gray; color: #333; }
      #vr-move-panel .wide { grid-column: 1 / -1; }
    </style>
    <div id="vr-toolbar">
      <!-- Back to the flat page for the same room and selected board (bug 1 / test A-06). -->
      <a id="vr-2d-view" class="toolbar-link" href="index.html" title="Go back to the 2D page for this room and the selected whiteboard. In full screen or a headset, leave VR first (Esc on a computer).">&#x2190; 2D view</a>
      <span id="vr-save-status" role="status"></span>
      <div class="label"><span id="vr-board-name"></span><span id="vr-board-state"></span></div>
      <select id="vr-board-select" title="Which whiteboard the buttons act on"></select>
      <button id="vr-add-board">Add whiteboard</button>
      <button id="vr-add-wrap-board" title="Add a 360&deg; board: a round wall you stand inside and draw on all the way round">Add 360&deg; board</button>
      <button id="vr-go-inside" disabled>Go inside</button>
      <select id="vr-board-size" title="Size of the selected whiteboard (changes it for everyone)"></select>
      <button id="vr-move-toggle" title="Move or turn the selected whiteboard in the room">Move board</button>
      <button id="vr-erase-board" class="erase-board" title="Clears the selected whiteboard for everyone. Click three times in a row.">Erase board</button>
      <button id="vr-remove-board" title="Removes the selected whiteboard for everyone. Click three times in a row.">Remove whiteboard</button>
      <button id="vr-save">Save</button>
      <button id="vr-rename">Rename</button>
      <button id="vr-save-all">Save all</button>
      <button id="vr-export-image">Export image</button>
      <button id="vr-recover" style="display: none">Restore unsaved</button>
    </div>
    <!-- Moves the selected board one step per click (in a headset, hold the grip button instead). -->
    <div id="vr-move-panel" hidden>
      <div class="title"><strong>Move selected board</strong><span id="vr-move-state"></span></div>
      <button data-move="turn-left" title="Turn 15 degrees">&#x27F2; Turn</button>
      <button data-move="up" title="Up 25 cm">&#x25B2; Up</button>
      <button data-move="turn-right" title="Turn 15 degrees the other way">Turn &#x27F3;</button>
      <button data-move="left" title="Slide 25 cm to its left">&#x25C0; Left</button>
      <button data-move="face" title="Turn it to face where you start">Face me</button>
      <button data-move="right" title="Slide 25 cm to its right">Right &#x25B6;</button>
      <button data-move="closer" title="25 cm closer">Closer</button>
      <button data-move="down" title="Down 25 cm">&#x25BC; Down</button>
      <button data-move="farther" title="25 cm farther away">Farther</button>
      <button id="vr-auto-place" class="wide" title="Put a board you moved back in its own place (where the automatic layout puts it)" disabled>Reset position</button>
    </div>
    <a-scene shadow="type: pcfsoft" renderer="antialias: true">
      <a-entity environment="groundTexture: none; grid: 1x1; gridColor: #111"></a-entity>

      <!-- The tool panel: one plate with every VR control on it, in rows
           (pens, boards, files, you). Its middle is the entity's origin and it
           faces +z. Where it sits (in front of you, on your left wrist, or left
           where you put it) is set by the "Panel" button and src/vr/tool-panel.js.
           Grip the handle on top (or anywhere on the plate) to move it yourself.
           It used to be a frame around the first board, so a bigger or nearer
           board hid its buttons (bugs V1 to V5). -->
      <a-entity id="tool-panel">
        <a-box id="vr-panel-plate" class="hittable panel-backing" material="shader: flat; color: #D3D9DF" position="0 0 -0.01" width="1.16" height="0.68" depth="0.02"></a-box>
        <!-- Grab handle (bug V6). -->
        <a-box id="vr-panel-handle" class="hittable" material="color: #4A5560; roughness: 0.6" position="0 0.375 0" width="0.42" height="0.06" depth="0.03"></a-box>
        <a-text id="vr-panel-handle-label" value="Grip here to move the panel" color="#FFFFFF" align="center" anchor="center" baseline="center" position="0 0.375 0.017" width="0.42"></a-text>

        <!-- Top strip: room and selected board, and the message line. -->
        <a-entity position="-0.54 0.3 0.012" scale="0.35 0.35 0.35" room-number></a-entity>
        <a-text id="vr-status-text" value="" color="#222" align="left" anchor="left" baseline="top" position="-0.14 0.315 0.012" width="0.7" wrap-count="50"></a-text>

        <!-- Pens: colours, pen size, highlighter, erasers. Every control needs a trigger press. -->
        <a-cylinder class="hittable" color-picker="color: black" position="-0.53 0.17 0.02" rotation="90 0 0" height="0.03" radius="0.027"></a-cylinder>
        <a-cylinder class="hittable" color-picker="color: #AC92EB" position="-0.46 0.17 0.02" rotation="90 0 0" height="0.03" radius="0.027"></a-cylinder>
        <a-cylinder class="hittable" color-picker="color: #4FC1E8" position="-0.39 0.17 0.02" rotation="90 0 0" height="0.03" radius="0.027"></a-cylinder>
        <a-cylinder class="hittable" color-picker="color: #A0D568" position="-0.32 0.17 0.02" rotation="90 0 0" height="0.03" radius="0.027"></a-cylinder>
        <a-cylinder class="hittable" color-picker="color: #EECE54" position="-0.25 0.17 0.02" rotation="90 0 0" height="0.03" radius="0.027"></a-cylinder>
        <a-cylinder class="hittable" color-picker="color: #ED5564" position="-0.18 0.17 0.02" rotation="90 0 0" height="0.03" radius="0.027"></a-cylinder>
        <a-cylinder class="hittable" color-picker="color: #FFFFFF" position="-0.11 0.17 0.02" rotation="90 0 0" height="0.03" radius="0.027"></a-cylinder>
        <!-- Pen size: thinner / thicker (5 to 50 px, steps of 10). -->
        <a-sphere class="hittable" size-smaller position="0.07 0.17 0.02" radius="0.027" scale="1 1 0.4">
            <a-text value="-" color="white" align="center" anchor="center" baseline="center" position="0 0.004 0.07" width="0.7"></a-text>
        </a-sphere>
        <a-text id="vr-pen-size-label" value="Pen size 10" color="#035E4F" align="center" anchor="center" baseline="center" position="0.21 0.17 0.012" width="0.5"></a-text>
        <a-sphere class="hittable" size-bigger position="0.35 0.17 0.02" radius="0.027" scale="1 1 0.4">
            <a-text value="+" color="white" align="center" anchor="center" baseline="center" position="0 0 0.07" width="0.7"></a-text>
        </a-sphere>
        <a-text id="vr-highlighter-label" value="Highlight: yellow" color="#035E4F" anchor="left" baseline="center" position="-0.495 0.085 0.012" width="0.48"></a-text>
        <a-box class="hittable" highlighter-picker position="-0.53 0.085 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-eraser-label" value="Eraser" color="#035E4F" anchor="left" baseline="center" position="-0.220 0.085 0.012" width="0.5"></a-text>
        <a-box class="hittable" eraser-picker position="-0.255 0.085 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-erase-highlights-label" value="Erase highlights" color="#035E4F" anchor="left" baseline="center" position="0.055 0.085 0.012" width="0.5"></a-text>
        <a-box class="hittable" eraser-picker="highlightsOnly: true" position="0.02 0.085 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-erase-all-label" value="Erase board (x3)" color="#C0392B" anchor="left" baseline="center" position="0.330 0.085 0.012" width="0.5"></a-text>
        <a-box class="hittable" erase-all position="0.295 0.085 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-box material="color: #B8BEC4" position="0 0.035 0.002" width="1.1" height="0.004" depth="0.004"></a-box>

        <!-- Boards. -->
        <a-text value="Add whiteboard" color="#035E4F" anchor="left" baseline="center" position="-0.495 -0.015 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: add-board" position="-0.53 -0.015 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text value="Add 360 board" color="#035E4F" anchor="left" baseline="center" position="-0.220 -0.015 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: add-wrap-board" position="-0.255 -0.015 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text value="Next board" color="#035E4F" anchor="left" baseline="center" position="0.055 -0.015 0.012" width="0.5"></a-text>
        <a-box id="vr-next-board-box" class="hittable" vr-button="action: next-board; enabled: false" position="0.02 -0.015 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-size-label" value="Size: 1.5 x 1 m" color="#035E4F" anchor="left" baseline="center" position="0.330 -0.015 0.012" width="0.5"></a-text>
        <a-box id="vr-size-box" class="hittable" vr-button="action: board-size; cooldown: 800" position="0.295 -0.015 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-auto-place-label" value="Reset position" color="#035E4F" anchor="left" baseline="center" position="-0.495 -0.095 0.012" width="0.5"></a-text>
        <a-box id="vr-auto-place-box" class="hittable" vr-button="action: auto-place" position="-0.53 -0.095 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-inside-label" value="Go inside" color="#035E4F" anchor="left" baseline="center" position="-0.220 -0.095 0.012" width="0.5"></a-text>
        <a-box id="vr-inside-box" class="hittable" vr-button="action: go-inside; enabled: false; cooldown: 800" position="-0.255 -0.095 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text value="Export image" color="#035E4F" anchor="left" baseline="center" position="0.055 -0.095 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: export" position="0.02 -0.095 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-remove-label" value="Remove board (x3)" color="#C0392B" anchor="left" baseline="center" position="0.330 -0.095 0.012" width="0.5"></a-text>
        <a-box id="vr-remove-board-box" class="hittable" vr-button="action: remove-board; color: #C0392B; enabled: false; cooldown: 250" position="0.295 -0.095 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-box material="color: #B8BEC4" position="0 -0.145 0.002" width="1.1" height="0.004" depth="0.004"></a-box>

        <!-- Saving, and you: moving, reach, the panel itself. -->
        <a-text value="Save" color="#035E4F" anchor="left" baseline="center" position="-0.495 -0.195 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: save" position="-0.53 -0.195 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text value="Save all" color="#035E4F" anchor="left" baseline="center" position="-0.220 -0.195 0.012" width="0.5"></a-text>
        <a-box id="vr-save-all-box" class="hittable" vr-button="action: save-all; enabled: false" position="-0.255 -0.195 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text value="Rename" color="#035E4F" anchor="left" baseline="center" position="0.055 -0.195 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: rename" position="0.02 -0.195 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-panel-label" value="Panel: Follow" color="#035E4F" anchor="left" baseline="center" position="0.330 -0.195 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: panel-mode; cooldown: 600" position="0.295 -0.195 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-moving-label" value="Moving: Teleport" color="#035E4F" anchor="left" baseline="center" position="-0.495 -0.275 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: moving-mode; cooldown: 600" position="-0.53 -0.275 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text id="vr-reach-label" value="Reach: Long" color="#035E4F" anchor="left" baseline="center" position="-0.220 -0.275 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: reach; cooldown: 600" position="-0.255 -0.275 0.02" scale="0.05 0.05 0.03"></a-box>
        <a-text value="Back to start" color="#035E4F" anchor="left" baseline="center" position="0.055 -0.275 0.012" width="0.5"></a-text>
        <a-box class="hittable" vr-button="action: back-to-start" position="0.02 -0.275 0.02" scale="0.05 0.05 0.03"></a-box>
      </a-entity>
      <!-- Was inside the tool panel; kept still here so the lighting doesn't move with the panel. -->
      <a-light type="directional" position="0 1.8 3" rotation="-45 0 0" intensity="0.4"></a-light>

      <!-- Whiteboards are added here by vr.js, one per board in the room. -->
      <a-entity id="boards"></a-entity>
      <!-- Soft light from where the user stands, so boards to the sides and
           behind aren't left in the dark (the original light only faces the front board). -->
      <a-light type="point" position="0 2.2 0.1" intensity="0.35" distance="8" decay="1"></a-light>

      <!-- The rig carries you around the room (teleport / smooth moving, see src/vr/locomotion.js).
           The pointer length (far) is set from the Reach setting in src/vr/reach.js. -->
      <a-entity id="rig">
        <a-entity id="camera" camera wasd-controls look-controls="enabled: true" position="0 1.3 0.1"></a-entity>

        <a-entity class="controller" laser-controls="hand: left" raycaster="objects: .hittable; far: 12" line="color: #000000" reach-line></a-entity>
        <a-entity class="controller" laser-controls="hand: right" raycaster="objects: .hittable; far: 12" line="color: #000000" reach-line></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
